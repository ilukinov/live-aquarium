<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#04101c">
<title data-t="cap.title">Оживи свою рыбку!</title>
<style>
  :root {
    --ink: #eaf6ff;
    --muted: #8aa6bd;
    --accent: #58d6ff;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(180deg, #06263f 0%, #04101c 100%);
    color: var(--ink);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 18px 40px;
    text-align: center;
  }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 26px; }

  /* Внутри меню аквариума страница живёт как врезка: своя подложка и своя
     ссылка «назад» там лишние — их даёт карточка меню. */
  body.embed { background: none; padding: 4px 14px 20px; }
  body.embed h1 { font-size: 20px; }
  body.embed .back { display: none; }

  /* Съёмка — тупиковый экран: без этой ссылки вернуться к аквариуму
     можно только кнопкой «назад» в браузере. */
  .back {
    position: fixed; top: 12px; left: 12px; z-index: 5;
    color: var(--muted); text-decoration: none; font-size: 13px;
    background: rgba(4, 16, 28, 0.72); border: 1px solid rgba(140, 200, 255, 0.18);
    border-radius: 999px; padding: 8px 14px;
  }
  .back:active { color: var(--ink); }

  .screen { display: none; width: 100%; max-width: 440px; }
  .screen.on { display: block; }

  .big {
    display: block; width: 100%;
    font: inherit; font-size: 19px; font-weight: 600;
    color: #04101c; background: var(--accent);
    border: 0; border-radius: 18px;
    padding: 18px 20px; margin: 14px 0 0;
    cursor: pointer;
  }
  .big:active { transform: translateY(1px); filter: brightness(1.1); }
  .big.green { background: var(--ok); }
  .big.ghost {
    background: transparent; color: var(--muted);
    border: 1.5px solid rgba(140, 200, 255, 0.3);
    font-weight: 500;
  }
  .big[hidden] { display: none; }
  input[type=file] { display: none; }

  .bubble { font-size: 64px; margin: 10px 0; }
  .fishname { font-size: 20px; font-weight: 600; margin: 14px 0 2px; }

  .preview {
    width: 100%; border-radius: 16px; margin-top: 10px;
    border: 1px solid rgba(140, 200, 255, 0.25);
    background: #0a2233;
  }
  .stage3d {
    width: 100%; aspect-ratio: 4 / 3; margin-top: 10px;
    border-radius: 16px; overflow: hidden; position: relative;
    border: 1px solid rgba(140, 200, 255, 0.25);
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(88, 214, 255, 0.25) 0%, transparent 55%),
      linear-gradient(180deg, #0d4a6b 0%, #04101c 100%);
  }
  .stage3d canvas { display: block; width: 100%; height: 100%; }
  .stage3d .spin3d {
    position: absolute; inset: 0; display: grid; place-content: center;
    color: var(--muted); font-size: 13px;
  }

  /* «Ярче цвета»: светлый карандаш подкручивается прямо на превью,
     до выпуска. Ползунок — единственная ручка, детям хватает одной. */
  .boostrow {
    display: flex; align-items: center; gap: 12px;
    margin: 14px 2px 0; text-align: left;
  }
  .boostrow label { flex: none; color: var(--muted); font-size: 14px; }
  .boostrow input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }

  .spin {
    width: 44px; height: 44px; margin: 30px auto 12px;
    border: 4px solid rgba(140, 200, 255, 0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .err {
    background: rgba(255, 100, 100, 0.12);
    border: 1px solid rgba(255, 120, 120, 0.4);
    border-radius: 14px; padding: 14px 16px;
    color: #ffc9c9; font-size: 14px; margin-top: 16px;
    text-align: left;
  }
  .hintline { color: var(--muted); font-size: 13px; margin-top: 22px; }

  /* Мост на телефон для больших экранов: выбор файла на компьютере — тупик,
     а камера всегда в кармане. Белая подложка обязательна: без неё сканер
     не видит код на тёмном. */
  .qrrow {
    display: flex; align-items: center; gap: 14px; text-align: left;
    margin: 26px auto 0; max-width: 400px;
    border-top: 1px solid rgba(140, 200, 255, 0.18); padding-top: 20px;
  }
  .qrrow .qrbox {
    flex: none; line-height: 0;
    background: #fff; border-radius: 10px; padding: 7px;
  }
  .qrrow .qrbox svg { display: block; width: 96px; height: 96px; }
  .qrrow .qrtext { color: var(--muted); font-size: 13px; }

  /* Раскраска на экране: сначала выбор рыбы по контурам, потом холст на
     весь экран — на планшете рисуют пальцем или Apple Pencil. */
  #s-pick.on { max-width: 1000px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .picks button {
    background: #fff; border: 0; border-radius: 16px; padding: 10px 8px 6px;
    cursor: pointer; font: inherit; font-size: 14px; color: #234;
  }
  .picks button:active { transform: scale(.97); }
  .picks svg { display: block; width: 100%; height: 90px; }

  body.drawing { overflow: hidden; position: fixed; inset: 0; padding: 0; }
  #s-draw.on {
    position: fixed; inset: 0; z-index: 10; max-width: none;
    display: flex; flex-direction: column; background: #dfe7ee;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .drawbar {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 10px; background: #04101c;
  }
  .drawbar button {
    font: inherit; font-size: 15px; color: var(--ink); cursor: pointer;
    background: #0a2233; border: 1.5px solid rgba(140, 200, 255, 0.3);
    border-radius: 12px; padding: 9px 14px; min-height: 44px;
  }
  .drawbar button.on { border-color: var(--accent); background: #0d4a6b; }
  .drawbar .grow { flex: 1; }
  .drawbar #d-done { background: var(--ok); color: #04101c; font-weight: 600; border: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatches button {
    width: 40px; height: 40px; min-height: 0; padding: 0; border-radius: 50%;
    border: 3px solid transparent; outline: 1px solid rgba(255,255,255,.35);
  }
  .swatches button.on { border-color: #fff; transform: scale(1.12); }
  #stage { flex: 1; position: relative; overflow: hidden; }
  #paper { position: absolute; background: #fff; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>

<a class="back" id="back" data-t="cap.back"></a>

<h1 data-t="cap.title"></h1>
<p class="sub" data-t="cap.sub"></p>

<!-- старт -->
<div class="screen on" id="s-start">
  <div class="bubble">📷</div>
  <label class="big" for="file" data-t="cap.shoot"></label>
  <input type="file" id="file" accept="image/*" capture="environment">
  <button class="big ghost" id="b-draw" data-t="cap.draw"></button>
  <p class="hintline" data-t="cap.hint"></p>
  <div class="qrrow" id="qrrow" hidden>
    <span class="qrbox" id="cap-qr"></span>
    <span class="qrtext" data-t="cap.qr"></span>
  </div>
</div>

<!-- раскраска на экране: выбор рыбы -->
<div class="screen" id="s-pick">
  <p class="fishname" data-t="cap.draw.pick"></p>
  <div class="picks" id="picks"></div>
  <button class="big ghost" id="d-pickback" data-t="cap.draw.back"></button>
</div>

<!-- раскраска на экране: холст на весь экран -->
<div class="screen" id="s-draw">
  <div class="drawbar">
    <button id="d-back">←</button>
    <button id="d-brush" class="on" data-t="cap.draw.brush"></button>
    <button id="d-fill" data-t="cap.draw.fill"></button>
    <button id="d-size">●</button>
    <button id="d-undo" data-t="cap.draw.undo"></button>
    <button id="d-clear" data-t="cap.draw.clear"></button>
    <span class="grow"></span>
    <button id="d-done" data-t="cap.draw.done"></button>
  </div>
  <div class="drawbar swatches" id="d-colors"></div>
  <div id="stage"><canvas id="paper"></canvas></div>
</div>

<!-- обработка -->
<div class="screen" id="s-busy">
  <div class="spin"></div>
  <p id="busy-text" data-t="cap.searching"></p>
</div>

<!-- превью -->
<div class="screen" id="s-preview">
  <p class="fishname" id="p-name"></p>
  <div class="stage3d" id="stage3d"><div class="spin3d" id="spin3d" data-t="cap.reviving"></div></div>
  <img class="preview" id="p-img" data-t-alt="cap.photo" hidden>
  <div class="boostrow">
    <label for="boost" data-t="cap.boost"></label>
    <input type="range" id="boost" min="0" max="100" value="0">
  </div>
  <button class="big green" id="b-release" data-t="cap.release"></button>
  <button class="big ghost" id="b-redraw" hidden data-t="cap.draw.more"></button>
  <label class="big ghost" for="file" data-t="cap.retake"></label>
</div>

<!-- готово -->
<div class="screen" id="s-done">
  <div class="bubble">🎉</div>
  <p class="fishname" data-t="cap.done"></p>
  <p class="sub" id="done-sub" data-t="cap.done.sub"></p>
  <label class="big" for="file" data-t="cap.again"></label>
  <button class="big ghost" id="b-draw2" data-t="cap.draw"></button>
</div>

<!-- ошибка -->
<div class="screen" id="s-error">
  <div class="bubble">🙈</div>
  <div class="err" id="err-text"></div>
  <button class="big" id="b-resend" hidden data-t="cap.resend"></button>
  <label class="big" id="l-retry" for="file" data-t="cap.retry"></label>
</div>

<script src="/assets/i18n.js"></script>
<script src="/vendor/qr.js"></script>
<script src="/vendor/three.min.js"></script>
<script src="/vendor/GLTFLoader.js"></script>
<!-- до fish-glb.js: он спрашивает у FishFrame оси и голову, иначе половина
     покупных рыб в превью развернётся хвостом вперёд -->
<script src="/assets/fish-frame.js"></script>
<script src="/assets/fish-glb.js"></script>
<script src="/assets/capture.js"></script>
<script src="/assets/tank.js"></script>
<script>
(function () {
  'use strict';

  // Снимать не в какой-то абстрактный аквариум, а в конкретный: адрес
  // страницы /t/<id>/capture говорит, в чей именно уплывёт рыбка.
  if (!Tank.id) { location.replace('/'); return; }

  document.getElementById('back').href = Tank.url;

  // Страница открыта внутри меню аквариума — убираем всё, что там повторяется.
  var EMBED = new URLSearchParams(location.search).has('embed');
  if (EMBED) document.body.classList.add('embed');

  // На устройстве без тача «Сфотографировать лист» открывает выбор файла —
  // тупик: камера у человека в кармане. Показываем мост: QR прямо на эту
  // страницу, телефон наводится и снимает там.
  if (!matchMedia('(pointer: coarse)').matches && window.qrcode) {
    try {
      var qr = qrcode(0, 'M');
      qr.addData(location.origin + Tank.url + '/capture');
      qr.make();
      document.getElementById('cap-qr').innerHTML = qr.createSvgTag(4, 0);
      document.getElementById('qrrow').hidden = false;
    } catch (e) { /* без QR кнопка выбора файла всё равно работает */ }
  }

  var inFrame = EMBED && window.parent !== window;

  function tell(msg) {
    if (!inFrame) return;
    try { window.parent.postMessage(msg, location.origin); } catch (e) { /* не критично */ }
  }

  // Аквариум за окном показывает рыбку сразу, не дожидаясь своего опроса.
  function tellTank() { tell({ aqua: 'fish-added' }); }

  // Экраны съёмки разной высоты — от кнопки до превью с 3D. Врезка не умеет
  // подстраиваться сама, поэтому свою высоту она сообщает наружу.
  // Открытое окно подтверждения бывает выше содержимого страницы — тогда
  // врезке нужна его высота, иначе окно срежется по краям.
  function frameHeight() {
    return Math.max(document.body.scrollHeight,
      (window.Modal && Modal.height && Modal.height()) || 0);
  }

  function tellHeight() { tell({ aqua: 'height', height: frameHeight() }); }

  if (inFrame) {
    if (window.ResizeObserver) new ResizeObserver(tellHeight).observe(document.body);
    addEventListener('load', tellHeight);
    tellHeight();

    // Аквариум не «на большом экране», а прямо за этим окном.
    var doneSub = document.getElementById('done-sub');
    doneSub.setAttribute('data-t', 'cap.done.sub.embed');
    doneSub.textContent = I18N.t('cap.done.sub.embed');

    // Меню открывает съёмку заново — начинать надо с камеры, а не с того
    // экрана, на котором ушли. Врезка живёт между открытиями, сама она
    // об этом не узнает, поэтому её будят снаружи.
    addEventListener('message', function (e) {
      if (e.origin !== location.origin || !e.data) return;
      if (e.data.aqua === 'reset') {
        result = null;
        show('s-start');
        tellHeight();
      }
    });
  }

  var manifest = null;
  var result = null;

  // ── 3D-предпросмотр: рыбка с раскраской ребёнка виляет хвостом ───────────
  var P3 = { ready: false, renderer: null, scene: null, camera: null, mesh: null, geos: {}, raf: 0 };

  function init3D() {
    if (P3.ready) return true;
    if (!window.THREE || !window.FishGLB) return false;
    try {
      P3.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    } catch (e) { return false; }
    P3.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    P3.renderer.outputEncoding = THREE.sRGBEncoding;
    document.getElementById('stage3d').appendChild(P3.renderer.domElement);
    P3.scene = new THREE.Scene();
    P3.camera = new THREE.PerspectiveCamera(42, 4 / 3, 0.1, 50);
    P3.camera.position.set(0, 0.4, 3.1);
    P3.camera.lookAt(0, 0, 0);
    P3.scene.add(new THREE.HemisphereLight(0xbfe4ff, 0x1a3550, 0.95));
    var dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(2, 4, 3);
    P3.scene.add(dir);
    P3.ready = true;
    return true;
  }

  // Геометрия вида с планарной UV бокового силуэта — та же рамка,
  // по которой capture.js кадрирует текстуру. Кэш по виду.
  function fishGeo(kind, cb) {
    if (P3.geos[kind]) return cb(P3.geos[kind]);
    var fish = null;
    manifest.fish.forEach(function (f) { if (f.name === kind) fish = f; });
    if (!fish) return cb(null);
    var spec = { url: fish.model, length: 2.4 };
    FishGLB.load([spec], function () {
      if (!spec.gltf) return cb(null);
      var geo = FishGLB.bake(spec);
      geo.computeBoundingBox();
      var bb = geo.boundingBox;
      var sz = Math.max(bb.max.z - bb.min.z, 1e-6), sy = Math.max(bb.max.y - bb.min.y, 1e-6);
      var p = geo.attributes.position;
      var uv = new Float32Array(p.count * 2);
      for (var i = 0; i < p.count; i++) {
        uv[i * 2] = (p.getZ(i) - bb.min.z) / sz;
        uv[i * 2 + 1] = (p.getY(i) - bb.min.y) / sy;
      }
      geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      geo.userData.range = [bb.min.z, bb.max.z];
      P3.geos[kind] = geo;
      cb(geo);
    });
  }

  function show3D(kind) {
    var flat = document.getElementById('p-img');
    var spin = document.getElementById('spin3d');
    spin.style.display = '';
    if (!init3D()) {
      document.getElementById('stage3d').style.display = 'none';
      flat.hidden = false;
      flat.src = result.preview;
      return;
    }
    fishGeo(kind, function (geo) {
      if (!geo) {
        document.getElementById('stage3d').style.display = 'none';
        flat.hidden = false;
        flat.src = result.preview;
        return;
      }
      if (P3.mesh) {
        P3.scene.remove(P3.mesh);
        if (P3.mesh.material.map) P3.mesh.material.map.dispose();
        P3.mesh.material.dispose();
      }
      // Текстура прямо из канваса, а не через dataURL: ползунок «Ярче цвета»
      // перерисовывает канвас, и рыбке хватает needsUpdate — без PNG.
      var tex = new THREE.CanvasTexture(result.boost.texCanvas);
      tex.encoding = THREE.sRGBEncoding;
      var mat = new THREE.MeshStandardMaterial({
        map: tex, roughness: 0.5, metalness: 0.05, side: THREE.DoubleSide
      });
      FishGLB.addBend(mat, {
        bodyMask: new THREE.Vector3(0, 0, 1),
        latMask: new THREE.Vector3(1, 0, 0),
        range: geo.userData.range,
        headAtMax: true
      }, 0.4, Math.random() * 6.28);
      P3.mesh = new THREE.Mesh(geo, mat);
      P3.scene.add(P3.mesh);
      spin.style.display = 'none';
      startLoop();
    });
  }

  function startLoop() {
    cancelAnimationFrame(P3.raf);
    var t0 = performance.now();
    function frame(now) {
      P3.raf = requestAnimationFrame(frame);
      var box = document.getElementById('stage3d');
      if (!box.offsetParent) return;   // экран превью скрыт
      var w = box.clientWidth, h = box.clientHeight;
      var el = P3.renderer.domElement;
      if (el.clientWidth !== w || el.clientHeight !== h) {
        P3.renderer.setSize(w, h, false);
        P3.camera.aspect = w / h;
        P3.camera.updateProjectionMatrix();
      }
      var t = (now - t0) / 1000;
      FishGLB.uTime.value = t;
      if (P3.mesh) {
        // боком к зрителю, с лёгким поворотом туда-сюда
        P3.mesh.rotation.y = Math.PI / 2 + Math.sin(t * 0.5) * 0.55;
        P3.mesh.position.y = Math.sin(t * 0.9) * 0.07;
      }
      P3.renderer.render(P3.scene, P3.camera);
    }
    P3.raf = requestAnimationFrame(frame);
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); });
    document.getElementById(id).classList.add('on');
    document.body.classList.toggle('drawing', id === 's-draw');
  }

  fetch('/assets/coloring/manifest.json')
    .then(function (r) { return r.json(); })
    .then(function (m) { manifest = m; if (location.hash === '#draw') openPick(); })
    .catch(function () {
      show('s-error');
      document.getElementById('err-text').textContent = I18N.t('cap.err.manifest');
    });

  // EXIF-поворот телефонных фото разруливает createImageBitmap
  function loadBitmap(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: 'from-image' })
        .catch(function () { return createImageBitmap(file); });
    }
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  window.handlePhoto = function (source) {   // отдельно — для автотестов
    show('s-busy');
    return FishCapture.processPhoto(source, manifest).then(function (r) {
      result = r;
      document.getElementById('p-name').textContent =
        I18N.t('cap.itis', { name: (r.titles && (r.titles[I18N.lang] || r.titles.ru)) || r.title });
      // ползунок стартует с авто-положения: бледный рисунок уже подкручен
      document.getElementById('boost').value = Math.round(r.boost.auto * 100);
      show('s-preview');
      show3D(r.kind);
      return r;
    }, function (err) {
      document.getElementById('err-text').textContent = String(err.message || err);
      show('s-error');
      throw err;
    });
  };

  // Живая подстройка: пиксели пересчитываются из сырой копии, 3D-текстура
  // обновляется через needsUpdate. Во время протяжки события схлопывает
  // rAF-затвор, но rAF — только оптимизация: в перекрытой вкладке Chrome
  // его замораживает, поэтому отпускание ползунка ('change') и отправка
  // применяют значение синхронно, иначе рыбка уплывёт неподкрученной.
  var boostEl = document.getElementById('boost');
  var boostQueued = false;
  function applyBoost() {
    boostQueued = false;
    if (!result || !result.boost) return;
    var v = boostEl.value / 100;
    if (result.boost.value === v) return;
    result.boost.set(v);
    if (P3.mesh && P3.mesh.material.map) P3.mesh.material.map.needsUpdate = true;
    var flat = document.getElementById('p-img');
    if (!flat.hidden) flat.src = result.boost.pvCanvas.toDataURL('image/png');
  }
  boostEl.addEventListener('input', function () {
    if (!boostQueued) { boostQueued = true; requestAnimationFrame(applyBoost); }
  });
  boostEl.addEventListener('change', applyBoost);

  document.getElementById('file').addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file || !manifest) return;
    document.getElementById('b-redraw').hidden = true;
    document.getElementById('b-resend').hidden = true;      // новая рыбка —
    document.getElementById('l-retry').classList.remove('ghost');  // старую не шлём
    show('s-busy');
    loadBitmap(file).then(window.handlePhoto, function () {
      document.getElementById('err-text').textContent = I18N.t('cap.err.photo');
      show('s-error');
    });
  });

  window.releaseFish = function () {         // отдельно — для автотестов
    if (!result) return Promise.reject(new Error(I18N.t('cap.err.nofish')));
    applyBoost();   // страховка: rAF мог не успеть — уходит то, что на ползунке
    document.getElementById('busy-text').textContent = I18N.t('cap.sending');
    show('s-busy');
    return fetch(Tank.api + '/fish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // текстура запекается с текущим положением ползунка — в аквариум
      // уплывает то, что человек видел на превью
      body: JSON.stringify({
        kind: result.kind,
        texture: result.boost ? result.boost.bake().texture : result.texture
      })
    }).then(function (r) {
      if (!r.ok) throw new Error(sendError(r.status));
      return r.json();
    }, function () {
      throw new Error(I18N.t('cap.err.busy'));   // сеть оборвалась
    }).then(function (r) {
      show('s-done');
      tellTank();
      return r;
    }, function (err) {
      // рыбка уже готова — переснимать лист не надо, хватит отправить снова
      document.getElementById('err-text').textContent = err.message || String(err);
      document.getElementById('b-resend').hidden = false;
      document.getElementById('l-retry').classList.add('ghost');
      show('s-error');
      throw err;
    });
  };

  // Коды ответа сервера — словами, понятными ребёнку и родителю.
  function sendError(code) {
    if (code === 409) return I18N.t('cap.err.full');
    if (code === 413) return I18N.t('cap.err.heavy');
    if (code === 507) return I18N.t('cap.err.disk');
    if (code === 404) return I18N.t('cap.err.gone');
    if (code >= 500) return I18N.t('cap.err.busy');
    return I18N.t('cap.err.send', { msg: I18N.t('cap.err.status', { code: code }) });
  }

  document.getElementById('b-resend').addEventListener('click', function () { window.releaseFish(); });

  document.getElementById('b-release').addEventListener('click', function () { window.releaseFish(); });

  // ── раскраска на экране ──
  // Лист рисуется на холст в том же масштабе, что и выровненное фото, и
  // готовый холст уходит в handlePhoto как снимок: метки на нём идеальные,
  // так что дальше всё как с бумагой — 3D-превью, ползунок, выпуск.
  // На экране холст увеличен так, что рыба занимает его целиком.
  var MM = 6;
  var paper = document.getElementById('paper');
  var stage = document.getElementById('stage');
  var pctx = paper.getContext('2d', { willReadFrequently: true });
  var fish = null, sheetImg = null, tool = 'brush', color = '#ff7a1a';
  var sizes = [8, 18, 36], size = 1, undo = [];
  var COLORS = ['#e8262a', '#ff7a1a', '#ffd31a', '#7ed321', '#1aa84c', '#1ac8e8',
                '#1a5ae8', '#7a3ae8', '#e83ab4', '#ff9ec4', '#8b5a2b', '#ffffff', '#222222'];

  var colorsEl = document.getElementById('d-colors');
  COLORS.forEach(function (c) {
    var b = document.createElement('button');
    b.style.background = c;
    b.setAttribute('aria-label', c);
    if (c === color) b.classList.add('on');
    b.addEventListener('click', function () {
      color = c;
      colorsEl.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    });
    colorsEl.appendChild(b);
  });

  function setTool(t) {
    tool = t;
    document.getElementById('d-brush').classList.toggle('on', t === 'brush');
    document.getElementById('d-fill').classList.toggle('on', t === 'fill');
  }
  document.getElementById('d-brush').addEventListener('click', function () { setTool('brush'); });
  document.getElementById('d-fill').addEventListener('click', function () { setTool('fill'); });
  document.getElementById('d-size').addEventListener('click', function () {
    size = (size + 1) % sizes.length;
    this.style.fontSize = (12 + size * 7) + 'px';
    setTool('brush');
  });

  function titleOf(f) { return (f.titles && (f.titles[I18N.lang] || f.titles.ru)) || f.title; }
  function sheetUrl(f) {
    return '/' + ((f.sheets && f.sheets[I18N.lang]) || f.svg).replace(/^\//, '');
  }

  // Габарит рыбы на листе, мм — по нему кадрируем холст на экране.
  function fishBox(f) {
    var st = f.sheetTransform, bz = f.bboxModel.z, by = f.bboxModel.y, pad = 6;
    return { x0: st.ox + st.scale * bz[0] - pad, x1: st.ox + st.scale * bz[1] + pad,
             y0: st.oy - st.scale * by[1] - pad, y1: st.oy - st.scale * by[0] + pad };
  }

  function layout() {
    if (!fish) return;
    var b = fishBox(fish), W = stage.clientWidth, H = stage.clientHeight;
    var k = Math.min(W / (b.x1 - b.x0), H / (b.y1 - b.y0));   // css-пикселей на мм
    paper.style.width = manifest.sheet.w * k + 'px';
    paper.style.height = manifest.sheet.h * k + 'px';
    paper.style.left = (W - (b.x1 - b.x0) * k) / 2 - b.x0 * k + 'px';
    paper.style.top = (H - (b.y1 - b.y0) * k) / 2 - b.y0 * k + 'px';
  }
  addEventListener('resize', layout);

  // Выбор рыбы — по контуру из манифеста, тем же, что напечатан на листе.
  function buildPicks() {
    var box = document.getElementById('picks');
    box.textContent = '';
    manifest.fish.forEach(function (f) {
      var c = f.contourModel, zs = c.map(function (p) { return p[0]; }), ys = c.map(function (p) { return p[1]; });
      var z0 = Math.min.apply(null, zs), z1 = Math.max.apply(null, zs);
      var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
      var pts = c.map(function (p) { return p[0].toFixed(3) + ',' + (-p[1]).toFixed(3); }).join(' ');
      var b = document.createElement('button');
      b.innerHTML = '<svg viewBox="' + [z0 - 0.03, -y1 - 0.03, z1 - z0 + 0.06, y1 - y0 + 0.06].join(' ') +
        '"><polygon points="' + pts + '" fill="#fff" stroke="#556" stroke-width="0.012" stroke-linejoin="round"/></svg>';
      var name = document.createElement('div');
      name.textContent = titleOf(f);
      b.appendChild(name);
      b.addEventListener('click', function () { startDrawing(f); });
      box.appendChild(b);
    });
  }

  function openPick() {
    if (!manifest) return;
    buildPicks();
    show('s-pick');
  }

  function startDrawing(f) {
    var img = new Image();
    img.onload = function () {
      fish = f;
      sheetImg = img;
      paper.width = Math.round(manifest.sheet.w * MM);
      paper.height = Math.round(manifest.sheet.h * MM);
      pctx.drawImage(img, 0, 0, paper.width, paper.height);
      undo = [];
      show('s-draw');
      layout();
    };
    img.src = sheetUrl(f);
  }

  // В меню аквариума страница живёт в маленькой врезке — рисовать там негде,
  // поэтому раскраска открывается отдельной страницей на весь экран.
  function drawEntry() {
    if (inFrame) { window.top.location.href = Tank.url + '/capture#draw'; return; }
    openPick();
  }
  document.getElementById('b-draw').addEventListener('click', drawEntry);
  document.getElementById('b-draw2').addEventListener('click', drawEntry);
  document.getElementById('d-pickback').addEventListener('click', function () { show('s-start'); });
  document.getElementById('d-back').addEventListener('click', openPick);
  document.getElementById('b-redraw').addEventListener('click', function () { show('s-draw'); layout(); });

  function remember() {
    undo.push(pctx.getImageData(0, 0, paper.width, paper.height));
    if (undo.length > 8) undo.shift();   // каждый снимок ~9 МБ — планшету хватит восьми
  }
  document.getElementById('d-undo').addEventListener('click', function () {
    if (undo.length) pctx.putImageData(undo.pop(), 0, 0);
  });
  document.getElementById('d-clear').addEventListener('click', function () {
    if (!sheetImg) return;
    remember();
    pctx.drawImage(sheetImg, 0, 0, paper.width, paper.height);
  });

  function at(e) {
    var r = paper.getBoundingClientRect();
    return [(e.clientX - r.left) * paper.width / r.width, (e.clientY - r.top) * paper.height / r.height];
  }

  // Заливка по похожему цвету: серый контур рыбы её останавливает.
  // Пунктир плавников — нет, это осознанно: плавник обычно того же цвета.
  function fill(x, y) {
    var W = paper.width, H = paper.height;
    x = x | 0; y = y | 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    var im = pctx.getImageData(0, 0, W, H), d = im.data;
    var i0 = (y * W + x) * 4, r0 = d[i0], g0 = d[i0 + 1], b0 = d[i0 + 2];
    var c = parseInt(color.slice(1), 16), nr = c >> 16, ng = (c >> 8) & 255, nb = c & 255;
    if (Math.abs(r0 - nr) + Math.abs(g0 - ng) + Math.abs(b0 - nb) < 10) return;
    var seen = new Uint8Array(W * H), stack = [y * W + x];
    while (stack.length) {
      var p = stack.pop();
      if (seen[p]) continue;
      seen[p] = 1;
      var k = p * 4;
      if (Math.abs(d[k] - r0) + Math.abs(d[k + 1] - g0) + Math.abs(d[k + 2] - b0) > 120) continue;
      d[k] = nr; d[k + 1] = ng; d[k + 2] = nb;
      var px = p % W;
      if (px > 0) stack.push(p - 1);
      if (px < W - 1) stack.push(p + 1);
      if (p >= W) stack.push(p - W);
      if (p < W * (H - 1)) stack.push(p + W);
    }
    pctx.putImageData(im, 0, 0);
  }

  // Apple Pencil: толщина от нажима, промежуточные точки из
  // getCoalescedEvents — линия не ломается на быстрых штрихах. Как только
  // карандаш коснулся холста, касания пальцем (ладонь на экране) игнорируем.
  var active = null, last = null, penSeen = false;
  function width(e) {
    return e.pointerType === 'pen' && e.pressure > 0 ? sizes[size] * (0.4 + e.pressure * 1.2) : sizes[size];
  }
  paper.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'pen') penSeen = true;
    if (!sheetImg || active !== null || (penSeen && e.pointerType === 'touch')) return;
    e.preventDefault();
    remember();
    var p = at(e);
    if (tool === 'fill') { fill(p[0], p[1]); return; }
    active = e.pointerId;
    last = p;
    try { paper.setPointerCapture(e.pointerId); } catch (err) { /* без захвата штрих просто обрывается на краю */ }
    pctx.fillStyle = color;
    pctx.beginPath();
    pctx.arc(p[0], p[1], width(e) / 2, 0, Math.PI * 2);
    pctx.fill();
  });
  paper.addEventListener('pointermove', function (e) {
    if (e.pointerId !== active) return;
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    if (!evs.length) evs = [e];
    pctx.strokeStyle = color;
    pctx.lineCap = 'round';
    evs.forEach(function (ev) {
      var p = at(ev);
      pctx.lineWidth = width(ev);
      pctx.beginPath();
      pctx.moveTo(last[0], last[1]);
      pctx.lineTo(p[0], p[1]);
      pctx.stroke();
      last = p;
    });
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    paper.addEventListener(ev, function (e) { if (e.pointerId === active) { active = null; last = null; } });
  });

  document.getElementById('d-done').addEventListener('click', function () {
    if (!sheetImg) return;
    // Метки печатаем поверх заново — кисть по углам не должна мешать распознаванию.
    var m = manifest.sheet, s = m.marker.size + 2;
    ['tl', 'tr', 'bl', 'br'].forEach(function (c) {
      var x = (m.markerPositions[c][0] - 1) * MM, y = (m.markerPositions[c][1] - 1) * MM;
      var sx = x * sheetImg.naturalWidth / paper.width, sy = y * sheetImg.naturalHeight / paper.height;
      pctx.drawImage(sheetImg, sx, sy, s * MM * sheetImg.naturalWidth / paper.width,
        s * MM * sheetImg.naturalHeight / paper.height, x, y, s * MM, s * MM);
    });
    document.getElementById('b-redraw').hidden = false;
    window.handlePhoto(paper);
  });
})();
</script>
</body>
</html>
